services:
  fastapi:
    build:
      context: ..
      dockerfile: FrontEnd/Dockerfile
    container_name: optisql-frontend
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
